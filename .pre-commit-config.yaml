
# Local Git hooks for the Chef Assistant project
repos:
  - repo: local
    hooks:
      # Prevent committing secrets and generated files
      - id: forbidden-files
        name: block secrets and generated files
        entry: python scripts/check_forbidden.py
        language: system

      # Check Python code for linting issues
      - id: ruff
        name: ruff lint
        entry: python -m ruff check
        language: system
        types: [python]

      # Run the Python test suite before commits
      - id: pytest
        name: python tests
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        files: \.py$

      # Check frontend code for linting issues
      - id: frontend-lint
        name: frontend eslint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/

      # Check frontend TypeScript types
      - id: frontend-typecheck
        name: frontend typecheck
        entry: npm --prefix frontend run typecheck
        language: system
        pass_filenames: false
        files: ^frontend/
