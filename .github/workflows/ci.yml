
# Name displayed in the GitHub Actions tab
name: Chef Assistant CI

# When should the workflow run?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Tasks GitHub should perform
jobs:
  quality-checks:
    name: Run project quality checks
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Step 4: Run Ruff
      - name: Run Ruff
        run: python -m ruff check

      # Step 5: Run Pytest
      - name: Run Pytest
        run: python -m pytest -q

      # Step 6: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Step 7: Install frontend dependencies
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Step 8: Run ESLint
      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      # Step 9: Run TypeScript checks
      - name: Run TypeScript
        run: npm run typecheck
        working-directory: frontend
        